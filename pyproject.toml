[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ctx-engine"
version = "0.1.0"
description = "Local-first Dockerized MCP context gateway for coding agents."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "ctx-engine contributors" }]
dependencies = [
  "tree-sitter-language-pack>=1.8.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.0",
]

[project.scripts]
ctx = "ctx_engine.cli:main"

[tool.setuptools.packages.find]
include = ["ctx_engine*"]

[tool.setuptools.package-data]
ctx_engine = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --ignore=tests/fixtures"
