[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ctx-engine"
version = "0.1.0"
description = "Local-first Dockerized MCP context gateway for coding agents."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "ctx-engine contributors" }]
dependencies = [
  "tree-sitter-language-pack>=1.8.1",
]

[project.urls]
Homepage = "https://github.com/Greonzhin/ctx-engine"
Repository = "https://github.com/Greonzhin/ctx-engine.git"
Issues = "https://github.com/Greonzhin/ctx-engine/issues"


[project.optional-dependencies]
dev = [
  "pytest>=9.1.1",
]

[project.scripts]
ctx = "ctx_engine.cli:main"

[tool.setuptools.packages.find]
include = ["ctx_engine*"]

[tool.setuptools.package-data]
ctx_engine = ["migrations/*.sql", "mcp_tool_registry.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --ignore=tests/fixtures"
