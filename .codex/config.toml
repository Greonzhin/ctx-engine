# generated by ctx-engine from .ctx-engine/rules.yaml
project_doc_fallback_filenames = ["AGENTS.md", "CLAUDE.md", "GEMINI.md"]
project_doc_max_bytes = 65536

[mcp_servers.ctx_engine]
url = "http://127.0.0.1:7331/mcp"
startup_timeout_sec = 20
tool_timeout_sec = 60
enabled = true
enabled_tools = [
  "workspace_register",
  "workspace_list",
  "index_repository",
  "search_symbols",
  "get_file_skeleton",
  "get_symbol_context",
  "get_context_capsule",
  "resolve_docs_context",
  "write_session_memory",
  "read_session_memory",
  "get_action_ledger",
  "get_doctor_status"
]
