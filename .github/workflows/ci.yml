name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: python-quality-gate (${{ matrix.os }}, python-${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dev package
        shell: pwsh
        run: python -m pip install -e ".[dev]"

      - name: Run full test suite
        shell: pwsh
        run: |
          $testTmp = Join-Path $env:RUNNER_TEMP ("pytest-" + [guid]::NewGuid().ToString("N"))
          python -m pytest -q --basetemp $testTmp

      - name: Run semantic quality gate
        shell: pwsh
        run: |
          $testTmp = Join-Path $env:RUNNER_TEMP ("pytest-" + [guid]::NewGuid().ToString("N"))
          python -m pytest -q --basetemp $testTmp tests/test_semantic_quality_gate.py tests/test_retrieval_benchmark.py

  docker:
    name: docker-runtime-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dev package
        shell: pwsh
        run: python -m pip install -e ".[dev]"

      - name: Run Docker runtime smoke
        shell: pwsh
        run: ./scripts/docker_smoke.ps1
