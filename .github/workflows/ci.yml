name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: python-quality-gate (${{ matrix.os }}, python-${{ matrix.python-version }})
    # ubuntu ayagini self-hosted'a cevirir; matrix DEGERI degismedigi icin is
    # adi (`test (ubuntu-latest, 3.x)`) ve zorunlu kontrol eslesmesi korunur.
    runs-on: ${{ matrix.os == 'ubuntu-latest' && 'self-hosted' || matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dev package
        shell: pwsh
        run: python -m pip install -e ".[dev]"

      - name: Run full test suite
        shell: pwsh
        run: |
          $testTmp = Join-Path $env:RUNNER_TEMP ("pytest-" + [guid]::NewGuid().ToString("N"))
          python -m pytest -q --basetemp $testTmp

      - name: Run semantic quality gate
        shell: pwsh
        run: |
          $testTmp = Join-Path $env:RUNNER_TEMP ("pytest-" + [guid]::NewGuid().ToString("N"))
          python -m pytest -q --basetemp $testTmp tests/test_semantic_quality_gate.py tests/test_retrieval_benchmark.py

  docker:
    name: docker-runtime-smoke
    # 2026-09-09: GitHub Actions kotasi doldu (isler adim=0 / ~2 sn / logsuz
    # duser). GREON'daki self-hosted runner'a alindi. GERI DONUS: bu satiri
    # `runs-on: ubuntu-latest` yap; kontrol ADI degismedigi icin zorunlu
    # kontrol listesine dokunmak gerekmez.
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dev package
        shell: pwsh
        run: python -m pip install -e ".[dev]"

      - name: Run Docker runtime smoke
        shell: pwsh
        run: ./scripts/docker_smoke.ps1
