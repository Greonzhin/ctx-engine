name: Security scans

# Kurulum 2026-08-18. PUBLIC repo: code scanning ücretsiz, SARIF doğrudan Security sekmesine gider.
# Varsayılan dal: main

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 0"   # Pazar 09:00 TR
  workflow_dispatch:

# ⚠️ 2026-08-18: hesabın Actions harcama limiti doldu (7 repoya aynı anda tarama
# eklenince Dependabot her PR'da tam taramayı tetikledi). Yük üç yerden düşürüldü:
#   1. `push` tetikleyicisi KALDIRILDI — PR + haftalık zamanlama zaten kapsıyor
#   2. `concurrency` + cancel-in-progress — üst üste binen koşumlar iptal
#   3. CodeQL Dependabot PR'larında ATLANIYOR — sürüm bumpı kaynak kodu değiştirmez,
#      bağımlılık tarafını Trivy + Dependabot alarmı zaten kapsıyor

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks (sır taraması)
    # 2026-09-09: GitHub Actions kotasi doldu (isler adim=0 / ~2 sn / logsuz
    # duser). GREON'daki self-hosted runner'a alindi. GERI DONUS: bu satiri
    # `runs-on: ubuntu-latest` yap; kontrol ADI degismedigi icin zorunlu
    # kontrol listesine dokunmak gerekmez.
    runs-on: [self-hosted, linux]
    permissions:
      contents: read
      pull-requests: read   # v3 PR taramasında pulls/<n>/commits çağırır
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITLEAKS_LICENSE: ""
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # v3'te PR taraması için ZORUNLU

  semgrep:
    name: Semgrep CE (security-audit)
    runs-on: [self-hosted, linux]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Semgrep kur (kaldirilan imajin etiketiyle ayni surum)
        run: python -m pip install --quiet semgrep==1.173.0
      - run: semgrep scan --config p/security-audit --error

  trivy-fs:
    name: Trivy bağımlılık CVE (CRITICAL kapı)
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "table"
          severity: "CRITICAL"
          exit-code: "1"
          ignore-unfixed: true
      - name: HIGH (bilgi amaçlı)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "table"
          severity: "HIGH"
          exit-code: "0"
          ignore-unfixed: true

  codeql:
    name: CodeQL SAST
    # Dependabot PR'ı kaynak kodu değiştirmez; en pahalı iş boşuna koşmasın.
    if: github.actor != 'dependabot[bot]'
    runs-on: [self-hosted, linux]
    permissions:
      contents: read
      security-events: write   # PUBLIC repo → code scanning ÜCRETSİZ, SARIF Security sekmesine yüklenir
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: ["python"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4
        with:
          languages: ${{ matrix.language }}
      # upload varsayılan (always): özel repolardaki `upload: never` + artifact
      # geçici çözümü BURADA GEREKMİYOR — bulgular doğrudan Security sekmesinde.
      - uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4
        with:
          category: "/language:${{ matrix.language }}"
